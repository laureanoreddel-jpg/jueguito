<!DOCTYPE html>
<html lang="es">
<head>

<title>La casa maldita</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b100d;--ink:#e8e2cf;--lamp:#d9b45a;--blood:#a4161a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,serif}
body{overflow:hidden}body.play,body.play *{cursor:none!important}
#wrap{position:fixed;inset:0}
canvas#c{width:100%;height:100%;display:block;background:#000}
#fx,#fade{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0;pointer-events:none}
#fx{background:#a4161a}#fade{background:#000}
#hud{position:absolute;left:14px;top:10px;font-size:15px;color:var(--lamp);opacity:.5;pointer-events:none;z-index:2}
#inv{position:absolute;left:14px;bottom:30px;font-size:20px;color:#eee;text-shadow:0 1px 3px #000;pointer-events:none;white-space:pre}

#xh{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none;display:none;transition:all .12s}
#xh.on{width:16px;height:16px;margin:-8px;background:transparent;border:2px solid #fff}
#hint{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:17px;color:#f0d890;text-shadow:0 1px 4px #000,0 0 8px #000;pointer-events:none;padding:0 10px}
#mm{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.45);border:1px solid #555;pointer-events:none;opacity:.75}
#veil{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0;pointer-events:none;background:linear-gradient(90deg,#000 0,#000 34%,rgba(0,0,0,.2) 38%,rgba(0,0,0,.2) 62%,#000 66%,#000 100%);transition:opacity .25s}
#err{position:absolute;left:0;right:0;bottom:0;color:#f66;font:12px monospace;background:rgba(0,0,0,.7);padding:2px 6px;display:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(20,24,20,.93),rgba(4,6,4,.97));padding:14px;overflow:auto}
#ov h1{font-size:clamp(34px,8vw,60px);margin:0 0 4px;font-weight:400;color:var(--blood);letter-spacing:.05em}
#ov h2{font-size:26px;margin:0 0 8px;font-weight:400;color:var(--lamp)}
#ov p{max-width:36em;margin:5px 0;font-size:clamp(14px,3.4vw,17px);line-height:1.38}
.col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:240px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;font-size:19px;margin:4px;padding:7px 22px;background:transparent;color:var(--lamp);border:2px solid var(--lamp);cursor:pointer;min-width:200px}
button.on{background:var(--lamp);color:#000}
button:hover,button:focus-visible{background:var(--lamp);color:#000;outline:none}
button.sm{min-width:0;font-size:16px;padding:5px 14px}
input[type=text]{font:inherit;font-size:20px;background:#111;color:var(--ink);border:2px solid #555;padding:6px 10px;text-align:center;width:200px;text-transform:none}
input[type=range]{width:220px;accent-color:var(--lamp)}
label{display:block;margin:8px 0 2px;color:#bbb;font-size:15px}
.code{font-size:48px;letter-spacing:.25em;color:var(--lamp);margin:4px 0}
.pl{list-style:none;padding:0;margin:6px 0;min-width:260px;text-align:left}
.pl li{padding:4px 10px;border-bottom:1px solid #333;font-size:18px}
small{position:fixed;bottom:3px;left:0;right:0;text-align:center;font-size:11px;opacity:.4;pointer-events:none;z-index:1}body.play small{display:none}
.s{color:#999;font-size:15px}
</style>
</head>

<small>Inspirado en Granny (DVloper) y Cursed House Multiplayer. Proyecto de fans, no oficial, sin fines comerciales.</small>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CS=1.1,WH=2.8,T=.24,GW=28,GD=24,PI=Math.PI,FN=['Subsuelo','Planta baja','Piso alto'],$=id=>document.getElementById(id);
const MODES={practica:{n:'Práctica',days:8,gs:.7,nz:.8},normal:{n:'Normal',days:5,gs:1,nz:1},pesadilla:{n:'Pesadilla',days:3,gs:1.25,nz:1.3}};
let cfg={sens:1,vol:.7,bright:1.1,fov:70,q:1,best:{},mode:'normal',map:0,name:'Jugador '+(10+Math.floor(Math.random()*90))};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cm_cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('cm_cfg',JSON.stringify(cfg))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
// ===== plano de la casa: 3 pisos con la misma estructura, patio atrás =====
const ROOMS={A1:[1,1,8,8],A2:[10,1,17,8],A3:[19,1,26,8],C:[1,10,26,11],B1:[1,13,7,16],B2:[9,13,16,16],B3:[18,13,26,16]};
const DOORS=[[4,9],[13,9],[22,9],[4,12],[12,12],[22,12],[9,5],[18,5],[8,14],[17,14]];
const FTY=[{A1:'k',A2:'k',A3:'k',C:'k',B1:'k',B2:'k',B3:'k'},{A1:'w',A2:'t',A3:'w',C:'w',B1:'w',B2:'c',B3:'w'},{A1:'c',A2:'t',A3:'c',C:'w',B1:'w',B2:'c',B3:'w'}];
const WINS=[[4,0],[13,0],[22,0],[0,5],[27,5],[27,14],[4,17],[22,17],[0,11],[27,11]];
const FH=WH,STAIRS=[{up:[26,15]},{up:[26,15],dn:[22,16]},{dn:[22,13]}];
const SW=[{f0:0,X0:22.5*CS,X1:27*CS-.12,Z0:15.5*CS,Z1:17*CS-.12,op:0},{f0:1,X0:22.5*CS,X1:27*CS-.12,Z0:12*CS+.12,Z1:12*CS+1.6,op:1}];
SW.forEach(s=>{s.Xs=s.X1-1.3;s.zc=(s.Z0+s.Z1)/2;s.zo=s.op?s.Z1:s.Z0;s.cx=[23,24,25,26,27];s.cz=s.op?[12,13]:[16,17]});
const OPEN=[[[8,8,13,15]],[[9,9,2,6],[18,18,3,6]],[]],PILL=[[[13,5],[22,5],[4,6]],[],[]];
const EXZ=14,NAMES={llave:'la Llave',alicate:'el Alicate',destornillador:'el Destornillador',taser:'el Taser (3 cargas)',ballesta:'la Ballesta (2 dardos)',dardos:'3 dardos',bateria:'2 cargas de Taser'};
const ROOMN=[{A1:'Caldera',A2:'Bodega',A3:'Taller',C:'Pasillo',B1:'Despensa',B2:'Cuarto oscuro',B3:'Escaleras'},{A1:'Sala',A2:'Cocina',A3:'Comedor',C:'Pasillo',B1:'Recibidor',B2:'Estudio',B3:'Escaleras'},{A1:'Dormitorio principal',A2:'Baño',A3:'Dormitorio',C:'Pasillo',B1:'Biblioteca',B2:'Cuarto de costura',B3:'Escaleras'}];
// muebles: [tipo, celdaX, celdaZ, pared contra la que apoya (n,s,e,w) o c=centro, objeto encima, estante]
const PROPS=[
 [['boiler',3,3,'c'],['crate',7,2,'c'],['crate',8,2,'c'],['shelf',1,6,'w'],['shelf',11,1,'n'],['shelf',13,1,'n','ballesta',1],['shelf',15,1,'n'],['crate',17,6,'c'],['barrel',17,7,'c'],
  ['workbench',22,1,'n','alicate'],['crate',26,6,'c'],['barrel',20,7,'c'],['shelf',26,3,'e'],['crate',7,10,'n'],['barrel',18,11,'s'],['shelf',1,15,'w'],['shelf',6,13,'n'],['crate',6,16,'s'],
  ['table',12,15,'c'],['crate',16,16,'s'],['barrel',9,16,'w'],['crate',20,16,'s'],['barrel',19,16,'s'],['shelf',24,13,'n'],['wardrobe',6,8,'s'],['wardrobe',3,16,'s']],
 [['sofa',4,1,'n'],['table',4,4,'c'],['shelf',1,6,'w','bateria',2],['shelf',8,1,'n'],['counter',11,1,'n'],['stove',13,1,'n'],['counter',15,1,'n','taser'],['fridge',17,1,'n'],['table',13,5,'c'],
  ['dtable',23,4,'c'],['shelf',26,2,'e'],['dresser',22,1,'n'],['dresser',10,10,'n'],['dresser',16,11,'s'],['dresser',4,16,'s'],['shelf',1,16,'w'],['desk',15,16,'s'],['shelf',9,16,'w'],['shelf',16,16,'e'],
  ['sofa',20,16,'s'],['table',20,14,'c'],['tree',4,20,'c'],['tree',22,19,'c'],['tree',24,22,'c'],['bench',14,22,'s'],['crate',7,22,'s'],['crate',8,22,'s'],['table',17,20,'c','destornillador'],['fireplace',1,3,'w'],['piano',8,8,'e'],['plant',1,1,'c'],['plant',19,1,'c'],['plant',26,8,'c'],['plant',1,10,'c'],['plant',26,10,'c'],['wardrobe',6,13,'n'],['wardrobe',16,13,'n']],
 [['bed',4,1,'n'],['wardrobe',1,5,'w'],['dresser',8,2,'e','llave'],['tub',15,1,'n'],['wc',11,1,'n'],['vanity',17,3,'e'],['bed',22,1,'n'],['wardrobe',26,4,'e'],['desk',20,8,'s'],['dresser',10,10,'n'],
  ['shelf',18,11,'s'],['shelf',1,14,'w'],['shelf',1,16,'w'],['shelf',6,13,'n'],['table',4,15,'c'],['desk',15,16,'s','dardos'],['shelf',9,16,'w'],['wardrobe',12,16,'s'],['sofa',22,16,'s'],['shelf',20,13,'n'],['plant',1,10,'c'],['plant',26,10,'c'],['plant',26,8,'c']]];
const SB=[.15,.6,1.05,1.5,1.9],SHELFBD=1;
const PD={plant:[.5,.5,1.1],piano:[1.6,.65,1.15],fireplace:[1.6,.5,1.3],stove:[1.8,.65,.905],sofa:[1.9,.9,.6],table:[1.4,.9,.78],dtable:[2.6,1.1,.78],shelf:[1.4,.4,1.95],counter:[1.8,.65,.905],fridge:[.8,.75,1.8],bed:[1.7,2.1,.55],wardrobe:[1.3,.6,2.1],desk:[1.4,.7,.765],dresser:[1.2,.5,.85],crate:[.8,.8,.6],tree:[.5,.5,4],bench:[1.4,.5,.45],boiler:[1.1,1.1,1.7],workbench:[2,.7,.93],tub:[1.7,.8,.55],wc:[.5,.7,.45],vanity:[.9,.5,.85],barrel:[.6,.6,.9]};
function mkFloor(f){
  const W=[],FT=[],DR=[];for(let z=0;z<GD;z++){W.push(Array(GW).fill(0));FT.push(Array(GW).fill(''));DR.push(Array(GW).fill(0))}
  for(let z=0;z<=17;z++)for(let x=0;x<GW;x++)W[z][x]=1;
  for(const k in ROOMS){const [x0,z0,x1,z1]=ROOMS[k];for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){W[z][x]=0;FT[z][x]=FTY[f][k]}}
  DOORS.forEach(([x,z])=>{W[z][x]=0;DR[z][x]=1;FT[z][x]=f?'w':'k'});
  OPEN[f].forEach(([a,b,c,d])=>{for(let z=c;z<=d;z++)for(let x=a;x<=b;x++){W[z][x]=0;DR[z][x]=0;FT[z][x]=FT[z][a-1]||FT[z][b+1]}});PILL[f].forEach(([x,z])=>{W[z][x]=1;DR[z][x]=0});
  if(f===1){for(let z=18;z<=23;z++)for(let x=0;x<GW;x++){const wl=x===0||x===GW-1||z===23;W[z][x]=wl?1:0;if(!wl)FT[z][x]='g'}W[17][12]=0;DR[17][12]=1;FT[17][12]='w';W[EXZ][0]=3}
  if(f>0)WINS.forEach(([x,z])=>{if(W[z][x]===1)W[z][x]=2});
  for(let z=0;z<GD;z++)for(let x=0;x<GW;x++)if(W[z][x]>0){let t='',gr='';for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const q=(FT[z+b]||[])[x+a]||'';if(q==='g')gr='g';else if(q&&!t)t=q}FT[z][x]=t||gr}
  const props=PROPS[f].map(s=>{const [t,cx,cz,sd,it]=s,[w,d,top]=PD[t];let x=cx*CS,z=cz*CS,rot=0,hw=w/2,hd=d/2;
    if(sd==='n')z=(cz-1)*CS+T/2+d/2;else if(sd==='s'){z=(cz+1)*CS-T/2-d/2;rot=PI}else if(sd==='w'){x=(cx-1)*CS+T/2+d/2;rot=PI/2;hw=d/2;hd=w/2}else if(sd==='e'){x=(cx+1)*CS-T/2-d/2;rot=-PI/2;hw=d/2;hd=w/2}
    if(t==='tree'){hw=hd=.25}return{t,x,z,rot,hw,hd,top,it,bd:s[5]===undefined?SHELFBD:s[5],hide:t==='wardrobe',d}});
  const boxes=[],isW=(x,z)=>x>=0&&z>=0&&x<GW&&z<GD&&W[z][x]>0;
  for(let z=0;z<GD;z++)for(let x=0;x<GW;x++){if(W[z][x]!==1&&W[z][x]!==2)continue;const l=isW(x-1,z),r=isW(x+1,z),u=isW(x,z-1),d=isW(x,z+1),cx=x*CS,cz=z*CS,h=T/2;
    if(l||r||!(u||d))boxes.push({x0:cx-(l?CS/2:h),x1:cx+(r?CS/2:h),z0:cz-h,z1:cz+h,wall:1});
    if(u||d)boxes.push({x0:cx-h,x1:cx+h,z0:cz-(u?CS/2:h),z1:cz+(d?CS/2:h),wall:1})}
  let exb=null;if(f===1){exb={x0:-T/2,x1:T/2,z0:EXZ*CS-CS/2,z1:EXZ*CS+CS/2,wall:1};boxes.push(exb)}
  props.forEach(p=>boxes.push({x0:p.x-p.hw,x1:p.x+p.hw,z0:p.z-p.hd,z1:p.z+p.hd}));
  const walk=[];for(let z=0;z<GD;z++){walk.push([]);for(let x=0;x<GW;x++){let ok=!!FT[z][x]&&W[z][x]===0;
    if(ok)for(const p of props)if(Math.abs(x*CS-p.x)<p.hw+.4&&Math.abs(z*CS-p.z)<p.hd+.4){ok=false;break}walk[z].push(ok)}}
  SW.forEach(s=>{if(f===s.f0){boxes.push({x0:s.X0,x1:s.Xs,z0:s.zo-.1,z1:s.zo+.1});s.tb={x0:s.X0-.25,x1:s.X0,z0:s.Z0,z1:s.Z1};boxes.push(s.tb)}
    if(f===s.f0+1)boxes.push({x0:s.X0,x1:s.X1,z0:s.zo-.1,z1:s.zo+.1});
    if(f===s.f0||f===s.f0+1)s.cx.forEach(x=>s.cz.forEach(z=>{if(walk[z]&&walk[z][x])walk[z][x]=false}))});
  return{W,FT,DR,props,boxes,exb,walk,st:STAIRS[f]}}
const FD=[0,1,2].map(mkFloor);
const ITEMS=[];FD.forEach((fl,f)=>fl.props.forEach(p=>{if(p.it){const y=p.t==='shelf'?SB[p.bd]+.02:p.top;ITEMS.push({f,t:p.it,x:p.x,z:p.z,y,rot:(ITEMS.length*1.7)%6.28})}}));
const SPAWN={f:1,x:19*CS,z:15*CS},GSP={f:2,x:22*CS,z:5*CS};
const ST=[{n:'cables',x:T/2,z:(EXZ-1)*CS,tool:'alicate',lbl:'cortar el cable',acc:'el Alicate'},{n:'candado',x:T/2,z:EXZ*CS,tool:'llave',lbl:'abrir el candado',acc:'la Llave'},{n:'tornillos',x:T/2,z:(EXZ+1)*CS,tool:'destornillador',lbl:'sacar los tornillos',acc:'el Destornillador'}];
function hit(f,x,z,r){for(const b of FD[f].boxes){if(b.off||b.x1<x-r||b.x0>x+r||b.z1<z-r||b.z0>z+r)continue;const dx=Math.max(b.x0-x,0,x-b.x1),dz=Math.max(b.z0-z,0,z-b.z1);if(dx*dx+dz*dz<r*r)return true}return false}
function nodeAt(f,x,z){const ix=Math.round(x/CS),iz=Math.round(z/CS),w=FD[f].walk;if(w[iz]&&w[iz][ix])return{f,x:ix,z:iz};
  for(let r=1;r<4;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++)if(w[iz+b]&&w[iz+b][ix+a])return{f,x:ix+a,z:iz+b};return{f,x:ix,z:iz}}
const allCells=[];FD.forEach((fl,f)=>{for(let z=0;z<GD;z++)for(let x=0;x<GW;x++)if(fl.walk[z][x])allCells.push({f,x,z})});
function bfs(a,b){const id=n=>(n.f*GD+n.z)*GW+n.x,prev=new Map(),q=[a];let h=0;prev.set(id(a),null);
  while(h<q.length){const n=q[h++];if(n.f===b.f&&n.x===b.x&&n.z===b.z)break;const fl=FD[n.f],o=[];
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=n.x+dx,z=n.z+dz;if(x>=0&&z>=0&&x<GW&&z<GD&&fl.walk[z][x])o.push({f:n.f,x,z})}
    if(fl.st.up&&fl.st.up[0]===n.x&&fl.st.up[1]===n.z){const t=FD[n.f+1].st.dn;o.push({f:n.f+1,x:t[0],z:t[1]})}if(fl.st.dn&&fl.st.dn[0]===n.x&&fl.st.dn[1]===n.z){const t=FD[n.f-1].st.up;o.push({f:n.f-1,x:t[0],z:t[1]})}
    for(const m of o)if(!prev.has(id(m))){prev.set(id(m),n);q.push(m)}}
  const path=[];let cur=b;if(!prev.has(id(b)))return path;while(cur){path.push(cur);cur=prev.get(id(cur))}return path.reverse()}

// ===== luces del techo (algunas cuartos están a oscuras), alfombras, cuadros y trampas =====
const ONMAP=[{A1:1,A2:0,A3:1,C:1,B1:1,B2:0,B3:1},{A1:1,A2:1,A3:1,C:1,B1:1,B2:1,B3:1},{A1:1,A2:1,A3:0,C:1,B1:1,B2:1,B3:1}];
const LAMPS=[0,1,2].map(f=>{const o=[];for(const k in ROOMS){const r=ROOMS[k];if(k==='C'){[4,13,22].forEach(x=>o.push({x:x*CS,z:10.5*CS,on:!!ONMAP[f].C}));continue}o.push({x:(r[0]+r[2])/2*CS,z:(r[1]+r[3])/2*CS,on:!!ONMAP[f][k]})}return o});
const RUGS=[[],[[4.5,4.5,3.6,2.6,0],[23.5,4.5,3.4,2,1],[4,14.5,2.4,1.5,2],[22,15,2.6,1.8,2]],[[4.5,4.5,3,2.2,1],[22.5,4.5,3,2.2,0],[4,15,2.4,1.5,2]]];
let sd2=77123;const rng2=()=>(sd2=(Math.imul(sd2,1664525)+1013904223)>>>0)/4294967296;
FD.forEach((fl,f)=>{const W=fl.W,FT=fl.FT,out=[];
  for(let z=0;z<=17;z++)for(let x=0;x<GW;x++){if(W[z][x]!==1)continue;
    for(const [nx,nz] of [[1,0],[-1,0],[0,1],[0,-1]]){const cx=x+nx,cz=z+nz;if(cz<0||cx<0||cx>=GW||cz>17||W[cz][cx]!==0||!FT[cz][cx]||FT[cz][cx]==='g'||fl.DR[cz][cx])continue;
      let ok=true;for(const [a,b] of (nz?[[1,0],[-1,0]]:[[0,1],[0,-1]]))if(((W[z+b]||[])[x+a])!==1)ok=false;if(!ok||rng2()>.12)continue;
      const px=x*CS+nx*(T/2+.02),pz=z*CS+nz*(T/2+.02);
      if(fl.props.some(p=>Math.abs(px+nx*.3-p.x)<p.hw+.3&&Math.abs(pz+nz*.3-p.z)<p.hd+.3))continue;if(out.some(o=>Math.hypot(o.x-px,o.z-pz)<3.2))continue;
      out.push({x:px,z:pz,nx,nz,s:Math.floor(rng2()*4)})}}
  fl.frames=out});

function joinGo(){const c=($('jc').value||'').trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c)){$('jc').style.borderColor='#a33';return}enterRoom(c,false)}
function findMenu(){scrFn=findMenu;const l=lobbyList.filter(p=>/^[A-Z0-9]{4}$/.test(String(p.presence.open)));
  ui('<h2>Salas abiertas</h2>'+(room?'':'<p class="s">Las salas online no están disponibles en esta vista.</p>')+(l.length?'<ul class="pl">'+l.map(p=>'<li>'+esc(p.presence.hn||'Anfitrión')+' · '+esc(MODES[p.presence.mode]?MODES[p.presence.mode].n:'Normal')+' <button class="sm" onclick="enterRoom(\''+p.presence.open+'\',false)">Unirse</button></li>').join('')+'</ul>':'<p class="s">No hay salas abiertas ahora. Creá una vos o pedile el código a un amigo.</p>')+'<div class="col"><button onclick="mainMenu()">Volver</button></div>')}
const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
function createRoom(){enterRoom(mkCode(),true)}
async function enterRoom(code,host){
  if(!room){ui(msgScr('Las salas online no están disponibles en esta vista. Abrí el link en claude.ai para jugar con amigos.'));return}
  try{if(rm){try{await rm.leave()}catch(e){}rm=null}
    rm=await room.join('sala-'+code.toLowerCase());rcode=code;isHost=host;rpeers=[];lastGo=0;const me=rm;
    rm.onPeers(ch=>{if(me!==rm)return;rpeers=ch.peers.filter(p=>!p.isMe&&p.presence&&p.presence.n);if(scrFn===lobbyScr)lobbyScr();checkGo()});
    await rm.presence({n:cfg.name,h:myHue,host:host,mode:cfg.mode});
    if(host)room.presence({open:code,hn:cfg.name,mode:cfg.mode}).catch(()=>{});
    lobbyScr()}catch(e){rm=null;ui(msgScr('No pude entrar a la sala ('+esc((e&&e.code)||'error')+').'))}}
function lobbyScr(){scrFn=lobbyScr;const hp=rpeers.find(p=>p.presence.host),md=isHost?cfg.mode:(hp&&MODES[hp.presence.mode]?hp.presence.mode:cfg.mode);
  const pl=[{n:cfg.name+' (vos)',host:isHost}].concat(rpeers.map(p=>({n:p.presence.n,host:p.presence.host})));
  ui('<h2>Sala</h2><p class="s">Código para tus amigos</p><div class="code">'+esc(rcode)+'</div><ul class="pl">'+pl.map(q=>'<li>'+esc(q.n)+(q.host?' · anfitrión':'')+'</li>').join('')+'</ul>'
   +(isHost?'<div class="col">'+modeBtns()+'<button onclick="hostStart()" style="margin-top:10px">Empezar partida</button>':'<p class="s">Dificultad: '+esc(MODES[md].n)+'</p><p>Esperando que el anfitrión empiece…</p><div class="col">')+'<button onclick="leaveRoom()">Salir de la sala</button></div>')}
function checkGo(){if(isHost||(S&&!S.over))return;const h=rpeers.find(p=>p.presence.host&&p.presence.go);if(h&&h.presence.go!==lastGo){lastGo=h.presence.go;cfg.mode=MODES[h.presence.mode]?h.presence.mode:'normal';startGame(cfg.mode)}}
function hostStart(){if(!rm)return;rm.presence({go:Date.now(),mode:cfg.mode}).catch(()=>{});if(room)room.presence({open:null}).catch(()=>{});startGame(cfg.mode)}
async function leaveRoom(){try{if(rm)await rm.leave()}catch(e){}if(room&&isHost)room.presence({open:null}).catch(()=>{});rm=null;rpeers=[];isHost=false;mainMenu()}
function howTo(){scrFn=howTo;ui('<h2>Cómo jugar</h2><p><b>Objetivo:</b> escapar de la mansión por la <b>puerta principal</b> (planta baja, pared oeste) antes de que se acaben los días.</p>'
  +'<p><b>1. Buscá herramientas</b> sobre los muebles (mesas, estantes, mesadas): el <b>alicate</b>, el <b>destornillador</b> y la <b>llave</b>. Mirá el objeto y apretá <b>E</b>.</p>'
  +'<p><b>2. En la puerta</b> mantené <b>E</b> mirando cada parte: cortar el <b>cable</b> (alicate), sacar los <b>tornillos</b> (destornillador) y abrir el <b>candado</b> (llave). Hace ruido.</p>'
  +'<p><b>3. La abuela</b> te oye: correr (Shift) y trabajar en la puerta la atraen. Si te toca, perdés un día. Podés aturdirla con el <b>Taser</b> (cerca) o la <b>Ballesta</b> (lejos): clic o F para usarlas, 1 y 2 para elegir.</p>'
  +'<p><b>Escondite:</b> mirá un armario y apretá <b>E</b> para esconderte; si la abuela te perdió de vista, quizás no te encuentre. <b>Trampas de oso</b> en el piso: te frenan a vos y a la abuela. A veces se corta la luz: usá la linterna (<b>L</b>). Agacharte (<b>C</b>) hace menos ruido y correr te cansa.</p><p><b>Casa:</b> 3 pisos y un patio. Las escaleras te llevan de un piso a otro: caminá hasta ellas.</p>'
  +'<p class="s">WASD caminar · mouse mirar (clic en la pantalla; Esc suelta) · Shift correr · C agacharse · E interactuar · L linterna · Tab mapa · H pistas · P pausa · M sonido</p><div class="col"><button onclick="mainMenu()">Volver</button></div>')}
function optMenu(back){if(back)backFn=back;scrFn=()=>optMenu();ui('<h2>Opciones</h2>'
  +'<label>Sensibilidad del mouse</label><input type="range" min=".3" max="2.5" step=".1" value="'+cfg.sens+'" oninput="cfg.sens=+this.value;saveCfg()">'
  +'<label>Volumen</label><input type="range" min="0" max="1" step=".05" value="'+cfg.vol+'" oninput="cfg.vol=+this.value;saveCfg();setVol()">'
  +'<label>Brillo</label><input type="range" min=".6" max="1.8" step=".05" value="'+cfg.bright+'" oninput="cfg.bright=+this.value;saveCfg();applyLight(S?S.p.f:1)">'
  +'<label>Campo de visión</label><input type="range" min="55" max="100" step="1" value="'+cfg.fov+'" oninput="cfg.fov=+this.value;saveCfg();applyGfx()">'
  +'<div class="col" style="margin-top:6px"><button class="sm" onclick="cfg.q=(cfg.q+1)%3;saveCfg();applyGfx();optMenu()">Calidad gráfica: '+['baja','media','alta'][cfg.q]+'</button></div>'
  +'<div class="col" style="margin-top:10px"><button class="'+(cfg.map?'on':'')+'" onclick="cfg.map=cfg.map?0:1;saveCfg();optMenu()">Minimapa: '+(cfg.map?'sí':'no')+'</button><button onclick="backFn()">Volver</button></div>')}
function credits(){scrFn=credits;ui('<h2>Créditos</h2><p>Proyecto de fans hecho para jugar con amigos, sin fines comerciales ni oficial.</p><p>Inspirado en <b>Granny</b> (DVloper) y <b>Cursed House Multiplayer</b>. Todos los modelos, texturas y sonidos de este juego fueron creados desde cero en código.</p><div class="col"><button onclick="mainMenu()">Volver</button></div>')}
function pauseMenu(){ui('<h2>Pausa</h2><div class="col"><button onclick="resume()">Reanudar</button><button onclick="optMenu(pauseMenu)">Opciones</button><button onclick="howTo2()">Cómo jugar</button><button onclick="quitGame()">Salir al menú</button></div>'+(rm?'<p class="s">En una sala el juego sigue para los demás mientras pausás.</p>':''))}
function howTo2(){howTo();backFn=pauseMenu;ov.querySelector('button').setAttribute('onclick','pauseMenu()')}
async function quitGame(){if(rm)await leaveRoom();else mainMenu()}
applyGfx();mainMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
